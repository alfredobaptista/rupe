spring:

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rupe}
    username: ${SPRING_DATASOURCE_USERNAME:alfredo}
    password: ${SPRING_DATASOURCE_PASSWORD:12345678}

  jpa:
    hibernate:
      ddl-auto: validate

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080